[workspace]
default-members = ["crates/ui", "crates/assets", "main"]
members = [
    "crates/macros",
    "crates/ui",
    "crates/assets",
    "crates/reqwest_client",
    "crates/core",
    "crates/jms",
    "examples/app_assets",
    "examples/hello_world",
    "examples/input",
    "examples/window_title",
    "examples/dialog_overlay",
    "examples/system_monitor",
    "examples/focus_trap",
    "crates/terminal",
    "crates/terminal_view",
    "crates/port_forwarding",
    "crates/port_forwarding_view",
    "main", "crates/ssh", "crates/sftp", "crates/sftp_view", "crates/one_ui"]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "crates/ui", version = "0.5.1" }
gpui-component-macros = { path = "crates/macros", version = "0.5.1" }
gpui-component-assets = { path = "crates/assets", version = "0.5.1" }

gpui = { git = "https://github.com/zed-industries/zed" ,rev = "8b5328ca"}
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "8b5328ca" }
util = { git = "https://github.com/zed-industries/zed", rev = "8b5328ca" }
gpui-macros = "0.2.2"
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

anyhow = "1.0.102"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "3"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
tracing = "0.1.41"
reqwest_client = { path = "crates/reqwest_client" }
one-ui = { path = "crates/one_ui" }
ssh = { path = "crates/ssh" }
sftp = { path = "crates/sftp" }
terminal = { path = "crates/terminal" }
terminal_view = { path = "crates/terminal_view" }
port_forwarding = { path = "crates/port_forwarding" }
port_forwarding_view = { path = "crates/port_forwarding_view" }
sftp_view = { path = "crates/sftp_view" }
one-core = { path = "crates/core" }
semver = "1.0.22"
regex = "1.10.0"
futures = "0.3"
image = "0.25.6"
rustls = "0.23.35"
tracing-subscriber = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.17"
http = "0.2"
futures-util = "0.3"
dirs = "6.0"
chrono = {version = "0.4.23", features = ["serde"]}
once_cell = "1.21"
proptest = "1.4"
rusqlite = { version = "0.38", features = ["bundled", "column_decltype"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
dashmap = "5.5.3"
moka = { version = "0.12", features = ["sync"] }
thiserror="2.0.14"
lru = "0.12"
rustls-native-certs = "0.8.1"

# SSH and SFTP
russh = "0.60.3"
russh-sftp = "2.1.2"
tokio-socks = "0.5"

# WebSocket (JumpServer Koko 终端隧道)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Terminal emulation
alacritty_terminal = "0.26"

# Serial port
serialport = "4"

parking_lot = "0.12"
bytes = "1.5"
interprocess = { version = "2.4.0", features = ["tokio"] }
url = "2.5.4"
percent-encoding = "2.3.1"
global-hotkey = "0.7.0"

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "8b5328ca" }
[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.61.0"
[workspace.lints.clippy]
# Correctness / bug-prone — warn
almost_complete_range = "warn"
borrowed_box = "warn"
let_underscore_future = "warn"
map_entry = "warn"
non_canonical_partial_ord_impl = "warn"
reversed_empty_ranges = "warn"

# Deliberate design choices — allow
arc_with_non_send_sync = "allow"
manual_is_multiple_of = "allow"
module_inception = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
type_complexity = "allow"

# Enforced
dbg_macro = "deny"
todo = "deny"

[profile.dev]

# 优化级别：0=无优化（默认，调试最佳），1=轻度优化，2=中度，3=高度
opt-level = 0
# 是否启用调试符号：true=启用（默认），false=禁用，"full"=完整符号（推荐）
debug = true
# 是否启用 debuginfo 行表（保证调试器能对应源码行）
debug-assertions = true
# 是否启用溢出检查（Debug 模式默认开启，Release 关闭）
overflow-checks = true
# 是否增量编译（加速二次构建，默认开启）
incremental = true
# panic 处理方式："unwind"=展开栈（默认），"abort"=直接终止程序
panic = "unwind"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui-macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
sum_tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
reqwest_client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
