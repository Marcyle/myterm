<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <!-- 镂空遮罩：白色显示，黑色挖空 -->
    <mask id="terminalMask">
      <rect width="1024" height="1024" fill="black"/>
      <rect x="96" y="176" width="832" height="672" rx="88" fill="white"/>
      <text
        x="512"
        y="585"
        text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="300"
        font-weight="800"
        letter-spacing="-18"
        fill="black">My</text>
    </mask>

    <!-- 轻微高光 -->
    <linearGradient id="terminalGradient" x1="96" y1="176" x2="928" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- 透明背景 -->
  <rect width="1024" height="1024" fill="none"/>

  <!-- 终端主体，中间 My 被镂空 -->
  <rect
    x="96"
    y="176"
    width="832"
    height="672"
    rx="88"
    fill="url(#terminalGradient)"
    filter="url(#shadow)"
    mask="url(#terminalMask)"
  />

  <!-- 细边框 -->
  <rect
    x="96"
    y="176"
    width="832"
    height="672"
    rx="88"
    fill="none"
    stroke="#2A2A2A"
    stroke-width="10"
    opacity="0.85"
  />
</svg>